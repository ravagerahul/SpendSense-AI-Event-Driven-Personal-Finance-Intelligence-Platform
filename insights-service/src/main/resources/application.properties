server.port=8086
spring.application.name=insights-service

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${POSTGRES_USER:spendsense}
spring.datasource.password=${POSTGRES_PASSWORD:spendsense_dev_password}

# Weekly, Sunday midnight. POST /api/insights/generate runs the same code on demand.
insights.cron=${INSIGHTS_CRON:0 0 0 * * SUN}
insights.period-days=${INSIGHTS_PERIOD_DAYS:7}

# A merchant must be charged the same amount on at least this many distinct dates before it
# counts as a subscription. Two charges is a coincidence; three is a pattern.
insights.subscription.min-occurrences=${INSIGHTS_MIN_OCCURRENCES:3}
