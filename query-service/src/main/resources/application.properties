server.port=8085
spring.application.name=query-service

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${POSTGRES_USER:spendsense}
spring.datasource.password=${POSTGRES_PASSWORD:spendsense_dev_password}

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# Must match storage-service, or stored and query vectors are not comparable.
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
rag.top-k=${RAG_TOP_K:5}
# Candidate merchant names passed to the SQL prompt, not a cap on rows aggregated.
merchant.top-k=${MERCHANT_TOP_K:10}
