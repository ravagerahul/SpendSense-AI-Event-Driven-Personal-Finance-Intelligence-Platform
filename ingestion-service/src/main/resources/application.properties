server.port=8080

# Names this service in every log line, in its log file name, and in GET /api/health. Where
# the file is written is decided in the shared logback-spring.xml, not here.
spring.application.name=ingestion-service

# Every machine-specific value is an environment variable with the local-development value as
# its default, so running from an IDE needs no setup and a container needs no separate
# properties file.
ingestion.api-key=${INGESTION_API_KEY:your-secret-key-here}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
