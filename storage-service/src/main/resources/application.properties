server.port=8083
spring.application.name=storage-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=storage-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${POSTGRES_USER:spendsense}
spring.datasource.password=${POSTGRES_PASSWORD:spendsense_dev_password}
# This service owns the schema: it runs schema.sql on every start, which is also how the
# ALTER TABLE migrations in that file reach an existing database.
spring.sql.init.mode=always

gemini.api-key=${GEMINI_API_KEY}
# Native output is 3072 values; outputDimensionality truncates to fit vector(768).
gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding-dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
