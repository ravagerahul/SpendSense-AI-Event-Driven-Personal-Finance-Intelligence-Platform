server.port=8082
spring.application.name=categorization-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Must differ from anomaly-service, or transaction-stored messages get split instead of fanned out.
spring.kafka.consumer.group-id=categorization-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${POSTGRES_USER:spendsense}
spring.datasource.password=${POSTGRES_PASSWORD:spendsense_dev_password}

gemini.api-key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
review.threshold=${REVIEW_THRESHOLD:0.7}
