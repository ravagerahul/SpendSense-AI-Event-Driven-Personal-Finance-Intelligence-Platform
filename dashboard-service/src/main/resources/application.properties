server.port=8087
spring.application.name=dashboard-service

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${POSTGRES_USER:spendsense}
spring.datasource.password=${POSTGRES_PASSWORD:spendsense_dev_password}

# This service serves its own /api/health (own status plus a ping to every other service), so
# the shared one from the common module stands down rather than competing for the mapping.
spendsense.health.shared-endpoint=false

# The React dev server by default. In a deployment this becomes the frontend's real domain;
# anything not listed here is refused by the browser, not by us.
dashboard.cors.allowed-origins=${DASHBOARD_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Proxy targets. Only two endpoints proxy; everything else reads Postgres directly. These
# become container hostnames in a deployment, which is why they are variables rather than
# constants.
dashboard.query-service.url=${QUERY_SERVICE_URL:http://localhost:8085}
dashboard.storage-service.url=${STORAGE_SERVICE_URL:http://localhost:8083}

# A chat question costs query-service four Gemini calls, so the read timeout is generous - but
# it exists. Without one a stuck downstream holds a Tomcat thread here indefinitely.
dashboard.proxy.connect-timeout-ms=${DASHBOARD_PROXY_CONNECT_TIMEOUT_MS:5000}
dashboard.proxy.read-timeout-ms=${DASHBOARD_PROXY_READ_TIMEOUT_MS:90000}

# Health pings must not make /api/health itself hang, but must not cry wolf either. Measured:
# 2000ms reported all seven DOWN while all seven were listening and healthy - a service's first
# request after idling initializes its DispatcherServlet and can take seconds. Since the pings
# run in parallel this is the endpoint's worst-case latency, not seven times it. The prod
# profile raises it further; see application-prod.properties.
dashboard.health.timeout-ms=${DASHBOARD_HEALTH_TIMEOUT_MS:5000}

dashboard.services.ingestion-service=${INGESTION_SERVICE_URL:http://localhost:8080}
dashboard.services.extraction-service=${EXTRACTION_SERVICE_URL:http://localhost:8081}
dashboard.services.categorization-service=${CATEGORIZATION_SERVICE_URL:http://localhost:8082}
dashboard.services.storage-service=${STORAGE_SERVICE_URL:http://localhost:8083}
dashboard.services.anomaly-service=${ANOMALY_SERVICE_URL:http://localhost:8084}
dashboard.services.query-service=${QUERY_SERVICE_URL:http://localhost:8085}
dashboard.services.insights-service=${INSIGHTS_SERVICE_URL:http://localhost:8086}
