# Applied on top of application.properties when SPRING_PROFILES_ACTIVE=prod.
#
# Containers start cold and all eight JVMs come up at once, so a service's first request can
# take far longer than it ever does on a warm machine. At 5s the BFF reported every dependency
# DOWN while every one of them was starting normally - a health endpoint that lies during
# startup is worse than none, because it trains you to ignore it.
#
# The pings run in parallel, so this is the endpoint's worst-case latency, not seven times it.
dashboard.health.timeout-ms=${DASHBOARD_HEALTH_TIMEOUT_MS:15000}
