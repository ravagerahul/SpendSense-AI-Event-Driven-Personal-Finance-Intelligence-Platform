server.port=8084
spring.application.name=anomaly-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Must differ from categorization-service, or transaction-stored messages get split instead of fanned out.
spring.kafka.consumer.group-id=anomaly-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/spendsense}
spring.datasource.username=${POSTGRES_USER:spendsense}
spring.datasource.password=${POSTGRES_PASSWORD:spendsense_dev_password}

# Minimum prior transactions before the unusual-amount rule is allowed to fire. With one or
# two data points an "average" is noise, and every second transaction looks like a spike.
anomaly.unusual-amount.min-history=${ANOMALY_MIN_HISTORY:3}
